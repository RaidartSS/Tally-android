name: Raidart APK (dev-gio)

on:
  push:
    branches:
      - dev-gio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Personal Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Quick lint & dead-code check
        working-directory: tests
        run: npm ci && npm run lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache debug keystore for consistent updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: personal-debug-keystore-v1

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tally-dev-gio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
